name: Verified workforce harness

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DAYFLOW_LLM_MODE: "off"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r backend/requirements.lock
          .venv/bin/python -m pip install --no-deps -e './backend[dev]'
          npm ci --prefix frontend
      - name: Backend lint and golden/integrity tests
        run: |
          .venv/bin/ruff check backend
          .venv/bin/pytest backend/tests -q
      - name: Publish measured synthetic scorecard
        run: |
          .venv/bin/python -m app.evals
          cat artifacts/scorecard.md >> "$GITHUB_STEP_SUMMARY"
      - name: Resolution agent scorecard (rules-only in CI; real-model run is in evidence/)
        run: |
          .venv/bin/python -m app.agent_eval --output artifacts/agent_scorecard.json
          echo '### Recorded real-model run' >> "$GITHUB_STEP_SUMMARY"
          python3 -c "import json;d=json.load(open('evidence/agent_scorecard.json'));print('```json');print(json.dumps(d['ai'],indent=1));print('```')" >> "$GITHUB_STEP_SUMMARY"
      - name: Web app typecheck, unit tests and build
        working-directory: web
        run: |
          npm ci
          npx tsc --noEmit
          npx vitest run
          npx vite build
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Build and exercise real browser workflows
        run: npm run test:e2e --prefix frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dayflow-evidence
          path: |
            artifacts/scorecard.*
            artifacts/agent_scorecard.json
            artifacts/dayflow-*.png
            frontend/test-results/
          if-no-files-found: warn
